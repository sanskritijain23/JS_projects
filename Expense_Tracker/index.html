<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 min-h-screen flex items-center justify-center py-10">
    <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-lg border border-green-100">
        <h1 class="text-2xl font-bold text-center text-green-800 mb-6">
            Expense Tracker
        </h1>

        <form id="expense-form" class="space-y-3 mb-6">
            <input id="expense-name" type="text" placeholder="Expense name" class="w-full border border-green-200 rounded-lg px-3 py-2 outline-none focus:border-green-500">
            <input id="expense-amount" type="number" step="0.01" placeholder="Amount" class="w-full border border-green-200 rounded-lg px-3 py-2 outline-none focus:border-green-500">

            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg">
                Add Expense
            </button>
        </form>

        <h2 class="text-lg font-bold text-green-800 mb-3">
            Expenses
        </h2>

        <ul id="expense-list" class="space-y-3"></ul>

        <div class="border-t border-green-100 mt-6 pt-4">
            <p id="total-amount" class="text-lg font-bold text-green-700 text-right">
                Total Amount: $0.00
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
