<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-50 min-h-screen py-10">
    <div class="max-w-3xl mx-auto px-4">
        <h1 class="text-3xl font-bold text-center text-blue-900 mb-8">
            Shopping Cart
        </h1>
        <div class="bg-white rounded-2xl shadow-md p-6 mb-6">
            <h2 class="text-xl font-bold text-blue-900 mb-4">
                Products
            </h2>
            <div id="product-list" class="space-y-3">
            </div>
        </div>
        <div class="bg-white rounded-2xl shadow-md p-6">
            <h2 class="text-xl font-bold text-blue-900 mb-4">
                Your Cart
            </h2>

            <div id="cart-items" class="space-y-2 text-gray-700">
            </div>
            <p  id="empty-cart-message"
                class="text-gray-500 text-center py-4">
                Your cart is empty.
            </p>
            <div id="cart-total-message"
                 class="hidden border-t mt-4 pt-4 flex justify-between items-center">
                <span class="font-bold text-lg">
                    Total:
                </span>
                <span id="total-price" class="font-bold text-lg text-blue-700">
                    $0.00
                </span>
            </div>
            <button id="checkout-button"
                class="mt-5 w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg">
                Checkout
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
