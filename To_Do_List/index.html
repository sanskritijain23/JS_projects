<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white w-full max-w-md p-6 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold text-center mb-6">
            To-Do List
        </h1>

        <div class="flex gap-2 mb-6">
            <input id="textInput" type="text" placeholder="Enter a task..." class="flex-1 border rounded-lg px-3 py-2 outline-none">
            <button id="addBtn" class="bg-black text-white px-4 py-2 rounded-lg">Add</button>
        </div>

        <div id="taskList" class="space-y-3">

        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
