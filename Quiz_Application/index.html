<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-indigo-50 min-h-screen flex items-center justify-center">
    <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-lg">
        <div id="start-screen" class="text-center">
            <h1 class="text-3xl font-bold text-indigo-800 mb-3">
                Quiz Application
            </h1>
            <p class="text-gray-500 mb-6">
                Test your knowledge!
            </p>

            <button id="start-btn"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg">
                Start Quiz
            </button>
        </div>
        <div id="quiz-container" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <span class="text-sm text-gray-500">
                    Question
                </span><span id="score" class="font-semibold text-indigo-700">
                    Score: 0
                </span>
            </div>
            <h2 id="question" class="text-xl font-bold text-gray-800 mb-5"></h2>
            <div id="choices" class="space-y-3"></div>
            <button id="next-btn"
                class="hidden mt-5 w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg">
                Next Question
            </button>
        </div>

        <div id="result-screen" class="hidden text-center">
            <h2 class="text-2xl font-bold text-indigo-800 mb-4">
                Quiz Completed!
            </h2>
            <p id="final-score" class="text-lg text-gray-700 mb-6"></p>
            <button id="restart-btn"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg">
                Restart Quiz
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
