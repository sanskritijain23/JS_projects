<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center">
    <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-md">
        <h1 class="text-2xl font-bold text-center mb-6">
            Weather App
        </h1>

        <div class="flex gap-2 mb-6">
            <input 
                  id="city-input"
                  type="text"
                  placeholder="Enter city name..."
                  class="flex-1 border border-blue-200 rounded-lg px-3 py-2 outline-none">
            <button 
                id="get-weather-btn"
                class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">
                Get Weather
            </button>
        </div>

        <div 
            id="weather-info"
            class="hidden bg-blue-50 border border-blue-100 rounded-lg p-4">

            <h2 
               id="city-name"
               class="text-xl font-bold text-blue-900 mb-2">
            </h2>

            <p 
               id="temperature"
               class="text-lg text-blue-800">
            </p>

            <p 
               id="description"
               class="text-blue-600 capitalize">
            </p>
        </div>

        <div 
            id="error-message"
            class="hidden bg-red-100 text-red-600 border border-red-100 p-3 rounded-lg text-center">
            City not found. Please try again.
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
